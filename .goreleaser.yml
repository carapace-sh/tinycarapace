version: 2

builds:
  - id: default
    builder: zig
    binary: tinycarapace
    targets:
      - x86_64-linux-musl
      - aarch64-linux-musl
      - x86_64-macos
      - aarch64-macos
      - x86_64-windows-gnu
      - aarch64-windows-gnu
    flags:
      - -Doptimize=ReleaseFast

archives:
  - id: default
    name_template: 'tinycarapace_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]

homebrew_casks:
  -
    name: tinycarapace
    description: "A minimal carapace-spec interpreter"
    homepage: "https://github.com/carapace-sh/tinycarapace"
    license: "MIT"
    repository:
      owner: rsteube
      name: homebrew-tap
      token: "{{ .Env.GORELEASER_GITHUB_TOKEN }}"
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"

scoops:
  -
    description: "A minimal carapace-spec interpreter"
    homepage: "https://github.com/carapace-sh/tinycarapace"
    license: "MIT"
    repository:
      owner: rsteube
      name: scoop-bucket
      token: "{{ .Env.GORELEASER_GITHUB_TOKEN }}"
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"

aurs:
  -
    description: "A minimal carapace-spec interpreter"
    homepage: "https://github.com/carapace-sh/tinycarapace"
    license: "MIT"
    maintainers:
      - rsteube <rsteube@users.noreply.github.com>
    private_key: '{{ .Env.AUR_KEY }}'
    git_url: 'ssh://aur@aur.archlinux.org/tinycarapace-bin.git'

nfpms:
  -
    description: "A minimal carapace-spec interpreter"
    homepage: "https://github.com/carapace-sh/tinycarapace"
    license: "MIT"
    maintainer: rsteube <rsteube@users.noreply.github.com>
    formats:
      - apk
      - deb
      - rpm
