name: Release

on:
  pull_request:
  push:

permissions:
  contents: write

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: shallow clone
        uses: actions/checkout@v7
        if: "!startsWith(github.ref, 'refs/tags/')"

      - name: deep clone
        uses: actions/checkout@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fetch-depth: 0

      - name: fix git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Test
        run: zig build test

      - name: Build
        run: zig build

      - uses: actions/upload-artifact@v7
        with:
          name: tinycarapace
          path: zig-out/bin/tinycarapace
          retention-days: 1

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check src build.zig

      - name: Test
        run: zig build test

      - name: Cross-compile
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=x86_64-linux-musl
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux-musl
          zig build -Doptimize=ReleaseFast -Dtarget=x86_64-macos
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-macos
          zig build -Doptimize=ReleaseFast -Dtarget=x86_64-windows-gnu
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-windows-gnu
