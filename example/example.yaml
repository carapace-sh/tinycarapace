name: example
description: example command
parsing: non-interspersed
flags:
  --verbose: verbose output
  -o, --output=: output file
  --format=: output format
  --color=: {description: color output, nargs: 1}
persistentflags:
  --config=: config file
exclusiveflags:
  - [verbose, format]
commands:
  - name: build
    description: build the project
    group: actions
    flags:
      --release: build in release mode
      --target=: target triple
    completion:
      flag:
        target: [x86_64-linux, aarch64-linux, x86_64-macos]
  - name: run
    description: run the project
    group: actions
    flags:
      --debug: enable debug mode
    completion:
      positional:
        - [main, lib, test]
  - name: test
    description: run tests
    completion:
      dash:
        - [d1, d2, d3]
        - [d4, d5]
      dashany: [extra]
      positionalany: [unit, integration, e2e]
  - name: hidden
    description: hidden subcommand
    hidden: true
